[package]
name = "hyprkvm-ui"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "hyprKvm desktop UI: Home, View and pairing popups for the edge-kvm backend"
publish = false

# Its own workspace, so the backend never builds against WebKitGTK/WebView2.
[workspace]

[[bin]]
name = "hyprkvm"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
edge-common = { path = "../../../crates/edge-common" }
edge-control = { path = "../../../crates/edge-control", features = ["tokio"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time", "process"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
