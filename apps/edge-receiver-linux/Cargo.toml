[package]
name = "edge-receiver-linux"
version = "0.1.1"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
libei = ["edge-linux-input/libei"]

[dependencies]
anyhow.workspace = true
clap.workspace = true
edge-common = { path = "../../crates/edge-common" }
edge-clipboard = { path = "../../crates/edge-clipboard" }
edge-audio = { path = "../../crates/edge-audio" }
edge-crypto = { path = "../../crates/edge-crypto" }
edge-geometry = { path = "../../crates/edge-geometry" }
edge-linux-input = { path = "../../crates/edge-linux-input" }
edge-linux-audio = { path = "../../crates/edge-linux-audio" }
edge-protocol = { path = "../../crates/edge-protocol" }
edge-runtime = { path = "../../crates/edge-runtime" }
edge-ui = { path = "../../crates/edge-ui" }
crc32fast = "1.5"
getrandom = "0.2"
hex.workspace = true
if-addrs = "0.15"
ksni = "0.3.5"
libc = "0.2"
image.workspace = true
qrcode = { version = "0.14", default-features = false }
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
socket2 = { version = "0.6.4", features = ["all"] }
tokio.workspace = true
tracing.workspace = true
zbus = { version = "5", default-features = false, features = ["tokio"] }

[dev-dependencies]
tempfile.workspace = true
