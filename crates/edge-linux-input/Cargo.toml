[package]
name = "edge-linux-input"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
libei = []

[dependencies]
edge-common = { path = "../edge-common" }
edge-clipboard = { path = "../edge-clipboard" }
edge-protocol = { path = "../edge-protocol" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13.13", default-features = false, features = ["input_capture", "tokio"] }
evdev = "0.13.2"
futures-util.workspace = true
libc = "0.2"
reis = { version = "0.7.1", features = ["tokio"] }
wayland-backend = "0.3.15"
wayland-client = "0.31.14"
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
wayland-scanner = "0.31.10"
