device_name = "Lua"
role = "receiver"
listen = "0.0.0.0:42420"
monitor = "eDP-1"

[input]
# auto selects uinput on Niri so compositor shortcuts receive remote keys.
backend = "auto"

[clipboard]
enabled = true
images_enabled = true
max_bytes = 1048576
max_image_bytes = 4194304

[audio]
enabled = false
local_playback = "redirect"
jitter_target_ms = 60
