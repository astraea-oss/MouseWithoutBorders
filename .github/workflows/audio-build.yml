name: Build and test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test Windows workspace
        run: cargo test --locked --workspace --exclude edge-receiver-linux
      - name: Lint Windows workspace
        run: cargo clippy --locked --workspace --all-targets --exclude edge-receiver-linux -- -D warnings
      - name: Build Windows controller
        run: cargo build --locked -p edge-controller-win --release
      - uses: actions/upload-artifact@v4
        with:
          name: edge-controller-win
          path: target/release/edge-controller-win.exe

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev pkg-config libasound2-dev libpipewire-0.3-dev libspa-0.2-dev libclang-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - name: Test Linux workspace
        run: cargo test --locked --workspace --exclude edge-controller-win
      - name: Lint Linux workspace
        run: cargo clippy --locked --workspace --all-targets --exclude edge-controller-win -- -D warnings
      - name: Build Linux receiver
        run: cargo build --locked -p edge-receiver-linux --release
      - uses: actions/upload-artifact@v4
        with:
          name: edge-receiver-linux
          path: target/release/edge-receiver-linux

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: edge-controller-win
          path: dist/windows
      - uses: actions/download-artifact@v4
        with:
          name: edge-receiver-linux
          path: dist/linux
      - name: Package portable apps
        run: |
          cp README.md LICENSE dist/windows/
          cp README.md LICENSE dist/linux/
          chmod +x dist/linux/edge-receiver-linux
          (cd dist/windows && zip -9 "../../edge-kvm-${GITHUB_REF_NAME}-windows-x86_64.zip" edge-controller-win.exe README.md LICENSE)
          (cd dist/linux && zip -9 "../../edge-kvm-${GITHUB_REF_NAME}-linux-x86_64.zip" edge-receiver-linux README.md LICENSE)
          sha256sum edge-kvm-*.zip > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" edge-kvm-*.zip SHA256SUMS.txt \
            --verify-tag --latest --title "$GITHUB_REF_NAME" --generate-notes \
            --notes "Download and extract the ZIP for your platform. To update, quit the app and replace its executable, keeping your existing config and state folder. Update both computers when upgrading from v0.1.1 because the protocol has changed. The Windows executable is unsigned."
